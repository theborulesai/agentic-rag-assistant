[project]
name = "rag-agent"
version = "0.1.0"
description = "Agentic RAG assistant built with LangChain + LangGraph + LangSmith by Sainath S Borule"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-core>=1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-openai>=1.2,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>=1.1,<2",
    "langchain-tavily>=0.2,<0.3",
    "chromadb>=1.5,<2",
    "pypdf>=6,<7",
    "fastapi>=0.136,<0.200",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=3.4,<4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "langsmith>=0.8,<0.9",
    "openevals>=0.2,<0.3",
    "ddgs>=9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
