services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      # OPENAI_API_KEY lives in the shell env, not .env — forward it through.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Keep persisted state inside the mounted volume.
      - CHROMA_DIR=/app/state/chroma_db
      - SQLITE_PATH=/app/state/memory.sqlite
    volumes:
      - state:/app/state
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  state:
